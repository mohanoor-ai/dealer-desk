name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealer
          POSTGRES_DB: dealer_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealer -d dealer_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - name: Core verification
        shell: bash
        run: |
          set -o pipefail
          uv run python -m scripts.verify 2>&1 | tee core-verification.txt
      - name: PostgreSQL integration regression
        run: uv run python -m pytest tests/test_auth.py tests/test_journey.py tests/test_photos.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://dealer@127.0.0.1:5432/dealer_test
      - run: docker build -t dealer-desk:ci .
      - name: Preserve verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implemented-api
          path: |
            openapi.yaml
            core-verification.txt
