name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.rehearsal.yml
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealer
          POSTGRES_DB: dealer_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealer -d dealer_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - name: Core verification
        shell: bash
        run: |
          set -o pipefail
          uv run python -m scripts.verify 2>&1 | tee core-verification.txt
      - name: PostgreSQL integration regression
        run: uv run python -m pytest tests/test_auth.py tests/test_journey.py tests/test_photos.py tests/test_customers.py tests/test_enquiry_workflow.py tests/test_leads.py tests/test_public_access.py tests/test_customer_staff_pipeline.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://dealer@127.0.0.1:5432/dealer_test
      - run: docker build -t dealer-desk:ci .
      - name: Clean Compose journey and container replacement
        shell: bash
        run: |
          set -euo pipefail
          python -c "import secrets,pathlib; pathlib.Path('.env.rehearsal').write_text('POSTGRES_PASSWORD='+secrets.token_hex(32)+'\nDEALER_PORT=8792\n')"
          docker compose -p dealer-rehearsal --env-file .env.rehearsal up --build -d --wait --wait-timeout 180
          docker compose -p dealer-rehearsal --env-file .env.rehearsal exec -T -e DEALER_CI_REHEARSAL=1 app python -m scripts.container_smoke create | tee container-verification.txt
          container=$(docker compose -p dealer-rehearsal --env-file .env.rehearsal ps -q app)
          docker cp "$container:/tmp/dealer-ci-journey.json" "$RUNNER_TEMP/dealer-ci-journey.json"
          docker compose -p dealer-rehearsal --env-file .env.rehearsal up -d --no-deps --force-recreate --wait app
          container=$(docker compose -p dealer-rehearsal --env-file .env.rehearsal ps -q app)
          docker cp "$RUNNER_TEMP/dealer-ci-journey.json" "$container:/tmp/dealer-ci-journey.json"
          docker compose -p dealer-rehearsal --env-file .env.rehearsal exec -T -u root app chown dealer:dealer /tmp/dealer-ci-journey.json
          docker compose -p dealer-rehearsal --env-file .env.rehearsal exec -T -e DEALER_CI_REHEARSAL=1 app python -m scripts.container_smoke verify | tee -a container-verification.txt
      - name: Previous-image rollback and forward recovery
        shell: bash
        run: |
          set -euo pipefail
          docker tag dealer-rehearsal-app:latest dealer-desk:rehearsal-current
          mkdir -p "$RUNNER_TEMP/previous-source"
          previous=0efadbc32abcd7e372f59f4f03f9a080f1068d1f
          printf 'current=%s\nprevious=%s\nschema=20261027_public_writes\n' "$(git rev-parse HEAD)" "$previous" > rollback-revisions.txt
          git archive "$previous" | tar -x -C "$RUNNER_TEMP/previous-source"
          docker build -t dealer-rehearsal-app:latest "$RUNNER_TEMP/previous-source"
          # Roll back application code only. Keep the audited current schema;
          # start the pinned prior API without running any migration command.
          printf '%s\n' 'services:' '  app:' '    command: ["python", "-m", "uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8090", "--no-access-log"]' > "$RUNNER_TEMP/rollback-compose.yml"
          docker compose -f docker-compose.yml -f docker-compose.rehearsal.yml -f "$RUNNER_TEMP/rollback-compose.yml" -p dealer-rehearsal --env-file .env.rehearsal up -d --no-build --no-deps --force-recreate --wait app || { docker compose -p dealer-rehearsal --env-file .env.rehearsal logs --tail 80 app; exit 1; }
          container=$(docker compose -p dealer-rehearsal --env-file .env.rehearsal ps -q app)
          docker cp scripts/container_smoke.py "$container:/app/scripts/container_smoke.py"
          docker cp "$RUNNER_TEMP/dealer-ci-journey.json" "$container:/tmp/dealer-ci-journey.json"
          docker compose -p dealer-rehearsal --env-file .env.rehearsal exec -T -u root app chown dealer:dealer /tmp/dealer-ci-journey.json
          docker compose -p dealer-rehearsal --env-file .env.rehearsal exec -T -e DEALER_CI_REHEARSAL=1 app python -m scripts.container_smoke verify-legacy | tee rollback-verification.txt
          docker tag dealer-desk:rehearsal-current dealer-rehearsal-app:latest
          docker compose -p dealer-rehearsal --env-file .env.rehearsal up -d --no-build --no-deps --force-recreate --wait app
          container=$(docker compose -p dealer-rehearsal --env-file .env.rehearsal ps -q app)
          docker cp "$RUNNER_TEMP/dealer-ci-journey.json" "$container:/tmp/dealer-ci-journey.json"
          docker compose -p dealer-rehearsal --env-file .env.rehearsal exec -T -u root app chown dealer:dealer /tmp/dealer-ci-journey.json
          docker compose -p dealer-rehearsal --env-file .env.rehearsal exec -T -e DEALER_CI_REHEARSAL=1 app python -m scripts.container_smoke verify | tee -a rollback-verification.txt
      - name: Controlled local operations rehearsal
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m ops.collector > "$RUNNER_TEMP/collector.txt" 2>&1 &
          collector=$!
          trap 'kill "$collector" || true' EXIT
          uv run python -m ops.rehearse
          uv run python -m ops.backup_lab
      - name: Preserve verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implemented-api
          path: |
            openapi.yaml
            core-verification.txt
            container-verification.txt
            rollback-verification.txt
            rollback-revisions.txt
            docs/evidence/incident-rehearsal.json
            docs/evidence/backup-restore.json
      - name: Stop disposable Compose services
        if: always()
        run: docker compose -p dealer-rehearsal --env-file .env.rehearsal stop
