<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Dealer Desk functionality</title><desc id="desc">Visitors browse vehicles and photos. Signed-in staff manage stock, record enquiries, plan follow-ups and see next actions. Public and staff APIs use a shared persistent database.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#68836b"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#173d2c}.muted{fill:#5d7063}.label{font-size:11px;letter-spacing:1.8px;font-weight:700}.body{font-size:15px}.small{font-size:12px}.title{font-size:23px;font-weight:700}.node{font-size:16px;font-weight:700}.line{stroke:#68836b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect x="1" y="1" width="1098" height="618" rx="18" fill="#faf9f5" stroke="#d7e0d4"/><text x="36" y="39" class="label">HOW DEALER DESK WORKS</text><text x="36" y="85" font-size="36" font-weight="700" letter-spacing="-1">From browsing to follow-up</text><text x="36" y="115" class="body muted">One dealership. A public website and a shared staff workspace.</text><rect x="32" y="146" width="348" height="216" rx="12" fill="white" stroke="#d1dccb"/><text x="54" y="183" class="title">Customer website</text><circle cx="69" cy="220" r="14" fill="#eaf1e5"/><text x="65" y="225" font-size="13" font-weight="700">1</text><text x="95" y="225" class="node">Browse vehicles</text><text x="95" y="247" class="small muted">Search, filter and compare reference prices</text><circle cx="69" cy="283" r="14" fill="#eaf1e5"/><text x="65" y="288" font-size="13" font-weight="700">2</text><text x="95" y="288" class="node">Open details and photos</text><rect x="54" y="317" width="174" height="25" rx="12" fill="#edf2e8"/><text x="67" y="334" class="small">Public browsing · no sign-in</text><rect x="400" y="146" width="668" height="216" rx="12" fill="#f0f5ec" stroke="#c8d7c1"/><text x="422" y="183" class="title">Staff workspace</text><rect x="922" y="164" width="124" height="25" rx="12" fill="#164d37"/><text x="934" y="181" style="fill:white;font-size:12px">Individual sign-in</text><rect x="422" y="216" width="142" height="80" rx="8" fill="white" stroke="#c8d7c1"/><text x="436" y="246" class="node">Stock</text><text x="436" y="270" class="small muted">Add or update</text><path d="M567 256H577" class="line"/><rect x="580" y="216" width="142" height="80" rx="8" fill="white" stroke="#c8d7c1"/><text x="594" y="246" class="node">Enquiries</text><text x="594" y="270" class="small muted">Record requests</text><path d="M725 256H735" class="line"/><rect x="738" y="216" width="142" height="80" rx="8" fill="white" stroke="#c8d7c1"/><text x="752" y="246" class="node">Follow-ups</text><text x="752" y="270" class="small muted">Plan and complete</text><path d="M883 256H893" class="line"/><rect x="896" y="216" width="142" height="80" rx="8" fill="white" stroke="#c8d7c1"/><text x="910" y="246" class="node">Overview</text><text x="910" y="270" class="small muted">See next actions</text><text x="422" y="330" class="body muted">Open enquiries show their next action or “No next action scheduled”.</text><path d="M206 362V391" class="line"/><path d="M734 362V391" class="line"/><rect x="32" y="396" width="348" height="76" rx="10" fill="white" stroke="#d1dccb"/><text x="54" y="426" class="node">Public catalogue API</text><text x="54" y="449" class="body muted">Reads public vehicle and photo fields only</text><rect x="400" y="396" width="668" height="76" rx="10" fill="white" stroke="#d1dccb"/><text x="422" y="426" class="node">Staff API</text><text x="422" y="449" class="body muted">Session and role checks · validation · revision conflict protection</text><path d="M206 472V506" class="line"/><path d="M734 472V506" class="line"/><rect x="32" y="510" width="1036" height="77" rx="10" fill="#164d37"/><text x="54" y="542" style="fill:white;font-size:19px;font-weight:700">Shared database</text><text x="54" y="566" style="fill:#e4efdc;font-size:14px">Vehicles · photos · enquiries · follow-ups</text><text x="724" y="553" style="fill:white;font-size:15px">Saved records survive page reloads</text><text x="36" y="609" class="small muted">Staff enter enquiries in the workspace. Public website enquiry delivery is not connected.</text></svg>