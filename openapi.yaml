components:
  schemas:
    ContactOutcome:
      properties:
        revision:
          type: integer
          minimum: 1.0
          title: Revision
        outcome:
          type: string
          maxLength: 300
          minLength: 1
          title: Outcome
        follow_up:
          anyOf:
          - $ref: '#/components/schemas/FollowUpPlan'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - revision
      - outcome
      title: ContactOutcome
    CoverSelection:
      properties:
        revision:
          type: integer
          minimum: 1.0
          title: Revision
      additionalProperties: false
      type: object
      required:
      - revision
      title: CoverSelection
    Credentials:
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 3
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 12
          title: Password
      additionalProperties: false
      type: object
      required:
      - email
      - password
      title: Credentials
    Dashboard:
      properties:
        available:
          type: integer
          title: Available
        reserved:
          type: integer
          title: Reserved
        sold:
          type: integer
          title: Sold
        stock_value_pence:
          type: integer
          title: Stock Value Pence
        open_enquiries:
          type: integer
          title: Open Enquiries
        open_tasks:
          type: integer
          title: Open Tasks
        overdue_tasks:
          type: integer
          title: Overdue Tasks
      type: object
      required:
      - available
      - reserved
      - sold
      - stock_value_pence
      - open_enquiries
      - open_tasks
      - overdue_tasks
      title: Dashboard
    Email:
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 3
          title: Email
      additionalProperties: false
      type: object
      required:
      - email
      title: Email
    EnquiryCreate:
      properties:
        vehicle_id:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Vehicle Id
        promotions_opt_in:
          type: boolean
          title: Promotions Opt In
          default: false
        source:
          type: string
          enum:
          - Website
          - Phone
          - Email
          - WhatsApp
          - SMS
          - Walk-in
          - Other
          title: Source
          default: Other
        request_type:
          type: string
          enum:
          - Check availability
          - Arrange a viewing
          - Book a test drive
          - Vehicle details
          - Request a callback
          - Other
          title: Request Type
          default: Other
        email:
          type: string
          maxLength: 254
          title: Email
          default: ''
        phone:
          type: string
          maxLength: 40
          title: Phone
          default: ''
        follow_up:
          anyOf:
          - $ref: '#/components/schemas/FollowUpPlan'
          - type: 'null'
        customer:
          type: string
          maxLength: 80
          minLength: 1
          title: Customer
        message:
          type: string
          maxLength: 1000
          minLength: 1
          title: Message
      additionalProperties: false
      type: object
      required:
      - customer
      - message
      title: EnquiryCreate
    EnquiryEdit:
      properties:
        revision:
          type: integer
          minimum: 1.0
          title: Revision
        status:
          type: string
          enum:
          - new
          - contacted
          - closed
          title: Status
      additionalProperties: false
      type: object
      required:
      - revision
      - status
      title: EnquiryEdit
    EnquiryOutput:
      properties:
        vehicle_id:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Vehicle Id
        promotions_opt_in:
          type: boolean
          title: Promotions Opt In
          default: false
